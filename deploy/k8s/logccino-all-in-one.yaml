apiVersion: v1
kind: Namespace
metadata:
  name: logccino
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch-cluster
  namespace: logccino
  labels:
    app: opensearch
spec:
  serviceName: opensearch-headless
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
      - name: opensearch
        image: opensearchproject/opensearch:2.18.0
        env:
        - name: discovery.type
          value: "single-node"
        - name: plugins.security.disabled
          value: "true"
        - name: OPENSEARCH_JAVA_OPTS
          value: "-Xms1g -Xmx1g"
        ports:
        - containerPort: 9200
          name: http
        - containerPort: 9600
          name: transport
        resources:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: "500m"
            memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch-service
  namespace: logccino
spec:
  ports:
  - port: 9200
    targetPort: 9200
    name: http
  selector:
    app: opensearch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logccino-backend
  namespace: logccino
  labels:
    app: logccino-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: logccino-backend
  template:
    metadata:
      labels:
        app: logccino-backend
    spec:
      containers:
      - name: logccino
        image: logccino/backend:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OPENSEARCH_HOST
          value: "opensearch-service"
        - name: OPENSEARCH_PORT
          value: "9200"
        - name: LOGCCINO_HOST
          value: "0.0.0.0"
        - name: LOGCCINO_PORT
          value: "8000"
        - name: MCP_TRANSPORT
          value: "sse"
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: "200m"
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: logccino-service
  namespace: logccino
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    name: http
  selector:
    app: logccino-backend
---
# Ingress example for Claude Desktop Remote MCP over SSE
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: logccino-ingress
  namespace: logccino
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  rules:
  - host: logccino.company.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: logccino-service
            port:
              number: 80
