{{define "content"}}
<div class="page-header">
  <div>
    <h1 class="page-title">레드팀 취약점 제보 연계 (Red Team Intake)</h1>
    <p class="page-subtitle">모의해킹 및 레드팀이 발견한 취약점 URL·파라미터를 기반으로 임시 헌팅 탐지 규칙을 즉시 생성합니다</p>
  </div>
  <div class="page-actions">
    <a href="/changes" class="btn btn-secondary">생성된 CR 목록</a>
  </div>
</div>

<div class="grid-detail">
  <div class="card">
    <div class="card-header"><h2 class="card-title">취약점 제보 폼</h2></div>
    <div class="card-body">
      <form method="POST" action="/redteam/submit" onsubmit="var b=this.querySelector('button[type=submit]');b.disabled=true;b.textContent='임시 헌팅 규칙 생성 중...';">
        <div class="form-group">
          <label class="form-label" for="rt-url">대상 엔드포인트 URL</label>
          <input id="rt-url" type="text" name="url" class="form-control mono" required placeholder="https://api.internal.corp/v1/auth/login">
        </div>
        <div class="form-group">
          <label class="form-label" for="rt-param">취약 파라미터 / 헤더</label>
          <input id="rt-param" type="text" name="param" class="form-control mono" required placeholder="user_token">
        </div>
        <div class="form-group">
          <label class="form-label" for="rt-vuln">취약점 유형 및 악용 시나리오</label>
          <input id="rt-vuln" type="text" name="vuln" class="form-control" required placeholder="SQL Injection in auth token probe">
        </div>
        <button type="submit" class="btn btn-primary">임시 헌팅 규칙 초안(CR) 생성</button>
      </form>
    </div>
  </div>

  <aside class="sticky-rail">
    <div class="card">
      <div class="card-header"><h2 class="card-title">임시 규칙 라이프사이클</h2></div>
      <div class="card-body">
        <div class="kv-list">
          <div class="kv-row" style="flex-direction:column;align-items:flex-start;gap:3px;">
            <strong style="font-size:12.5px;">Status: Temporary</strong>
            <span class="text-secondary" style="font-size:12px;">자동 만료일(TTL)이 부여된 임시 방어 탐지 규칙으로 생성됩니다.</span>
          </div>
          <div class="kv-row" style="flex-direction:column;align-items:flex-start;gap:3px;">
            <strong style="font-size:12.5px;">승인 후 운영 적용</strong>
            <span class="text-secondary" style="font-size:12px;">생성 직후 Change Request 상세 화면으로 이동하며, 승인 버튼으로 Splunk에 즉시 배포됩니다.</span>
          </div>
        </div>
      </div>
    </div>
  </aside>
</div>
{{end}}
