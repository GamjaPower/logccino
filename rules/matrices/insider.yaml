name: Insider Threat Exfiltration Matrix
tactics:
  - id: collection
    name: 데이터 수집 (Collection)
    techniques:
      - id: IT-COL-01
        name: 회계/재무 기밀 문서 복사
      - id: IT-COL-02
        name: 소스코드 저장소 대량 클론
  - id: staging
    name: 데이터 압축 및 스테이징 (Staging)
    techniques:
      - id: IT-STG-01
        name: 암호화 압축 (ZIP/RAR)
      - id: IT-STG-02
        name: 비인가 임시 폴더 이동
  - id: exfiltration
    name: 데이터 반출 (Exfiltration)
    techniques:
      - id: IT-EXF-01
        name: 공용 파일 변환/클라우드 사이트 웹 업로드
      - id: IT-EXF-02
        name: 개인 USB 외장 매체 이동
      - id: IT-EXF-03
        name: 개인 웹메일/메신저 전송
