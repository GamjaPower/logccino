index: soc_alerts
sourcetype: dac:alert
time_field: _time
description: Aggregated security alerts generated by Detection as Code rules
fields:
  - name: alert_id
    type: string
    description: Unique hash identifier of the alert instance
  - name: rule_id
    type: string
    description: Detection rule identifier (e.g., DET-WEB-0007)
  - name: rule_name
    type: string
    description: Human readable name of detection rule
  - name: rule_version
    type: number
    description: Version number of detection rule
  - name: severity
    type: string
    description: Alert severity (critical, high, medium, low)
  - name: entity_type
    type: string
    description: Primary investigated entity type (ip, host, user)
  - name: entity_value
    type: string
    description: Value of primary entity
