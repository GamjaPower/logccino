  - rule_id
  - rule_name
  - rule_version
  - severity
  - event_time
  - entity_type
  - entity_value
optional_cim_fields:
  - src_ip
  - dest_ip
  - user
  - host
  - process
  - command_line
  - file_name
  - uri_path
